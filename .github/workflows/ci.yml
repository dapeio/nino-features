name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every feature against a Nino checkout: its manifest has to validate, its
  # own tests have to pass, and static analysis has to stay clean. main is
  # what the kernel is about to become, the latest tag what a project runs
  # today - a feature has to hold on both
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        nino: [ main, latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpstan:2.2.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint all PHP files
        run: find features bin server tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Lint all JS files
        run: find features -name "*.js" -print0 | xargs -0 -r -n1 node --check

      - name: Fetch Nino (${{ matrix.nino }})
        run: |
          git clone --depth 1 https://github.com/dapeio/nino.git nino
          if [ "${{ matrix.nino }}" = "latest" ]; then
            # versionsort.suffix: git's version sort puts a suffixed tag after its
            # base by default (v1.3.0-beta after v1.3.0), so a release would never
            # be "latest" while its own pre-release tag exists. With '-' as the
            # suffix every -beta/-rc sorts below the release it precedes
            cd nino && git fetch --tags --depth 1 && tag=$(git -c versionsort.suffix=- tag --sort=-v:refname | head -n1) && [ -n "$tag" ] && git checkout -q "$tag" && echo "Nino $tag"
          fi

      # The same layout a project has: every feature the checkout can run
      # below its features/, where the autoloader and the tests find it. A
      # feature written for a newer Nino than the one under test (its "nino"
      # constraint, read by the checkout's own \Nino\Features::satisfies())
      # claims nothing about it: it is listed with its reason and left out,
      # and the tests, the contract test, PHPStan and ESLint see the rest.
      # The tests that go over every feature ask the same question
      - name: Install every feature into the checkout that it can run
        run: |
          names=$(php bin/applicable.php nino)
          for name in $names; do
            cp -R "features/$name" "nino/features/$name"
          done

      - name: Validate every manifest
        run: php bin/catalogue.php nino > catalogue.json && cat catalogue.json

      - name: Run every feature's own smoke tests
        run: for test in nino/features/*/tests/*-smoke.php; do [ -e "$test" ] || continue; php "$test" || exit 1; done

      # Every feature's text keys follow the grammar of the kernel's: what
      # needs no kernel always, the rest where the checkout has what it is
      # checked against (\Nino\Modules\Template::category())
      - name: Run the text key grammar's smoke test
        run: NINO_ROOT=nino php tests/keys-smoke.php

      # The publishing tool builds a signed catalogue of this repository's
      # features into a directory of its own, and the kernel has to accept
      # what came out (see .github/workflows/release.yml for the real thing)
      - name: Run the publishing tool's smoke test
        run: NINO_ROOT=nino php tests/build-smoke.php

      # The catalogue's own rules over every feature's files: markup belongs in
      # a template, the text is English, the escape keeps what it cannot
      # encode, and a panel reaches the workbench the way it has to
      - name: Run the catalogue's rule tests
        run: for test in markup language escaping panels; do php "tests/$test-smoke.php" || exit 1; done

      # The endpoint the release workflow posts to, driven as a library and
      # once through php's built-in server
      - name: Run the publishing endpoint's smoke test
        run: NINO_ROOT=nino php tests/publish-smoke.php

      - name: Run the local release script's smoke test
        run: NINO_ROOT=nino php tests/release-smoke.php

      # Nino's own suite still passes with the features in place - a feature
      # that breaks the kernel's tests is not compatible either
      - name: Run Nino's features contract test
        run: cd nino && php tests/features-smoke.php

      - name: Analyse the features with PHPStan
        run: cd nino && phpstan analyse --no-progress --memory-limit=1G

      - name: Analyse the panel scripts with ESLint
        run: cd nino && npx --yes eslint@9.39.0 features

      - name: Keep the catalogue as an artifact
        if: matrix.nino == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: catalogue
          path: catalogue.json
