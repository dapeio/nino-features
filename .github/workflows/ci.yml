name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# features-1x/, applications-1x/ and tests-1x/ are read by no step: they hold
# what was written for Nino 1 and waits for its move to Nino 2 (README.md)
jobs:
  # Every feature against a Nino checkout: its manifest has to validate, its
  # own tests have to pass, and static analysis has to stay clean. Against main
  # alone: the catalogue is format 2, which reads components, blocks and
  # themes the way main does, and every feature of features/ asks for ^2.0 -
  # Nino 1, the latest tag until the first 2.x one, has no \Nino\Packages to
  # build the packages with and would skip every feature
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpstan:2.2.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint all PHP files
        run: find features bin tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Lint all JS files
        run: find features -name "*.js" -print0 | xargs -0 -r -n1 node --check

      - name: Fetch Nino (main)
        run: git clone --depth 1 https://github.com/dapeio/nino.git nino

      # The same layout a project has: every feature the checkout can run
      # below its features/, where the autoloader and the tests find it. A
      # feature written for a newer Nino than the one under test (its "nino"
      # constraint, read by the checkout's own \Nino\Features::satisfies())
      # claims nothing about it: it is listed with its reason and left out,
      # and the tests, the contract test, PHPStan and ESLint see the rest.
      # The tests that go over every feature ask the same question
      - name: Install every feature into the checkout that it can run
        run: |
          names=$(php bin/applicable.php nino)
          for name in $names; do
            cp -R "features/$name" "nino/features/$name"
          done

      - name: Validate every manifest
        run: php bin/catalogue.php nino > catalogue.json && cat catalogue.json

      - name: Run every feature's own smoke tests
        run: for test in nino/features/*/tests/*-smoke.php; do [ -e "$test" ] || continue; php "$test" || exit 1; done

      # Every test of this repository's own, against the same checkout: each
      # test's header says what it holds
      - name: Run the catalogue's own tests
        run: for test in tests/*-smoke.php; do [ -e "$test" ] || continue; NINO_ROOT=nino php "$test" || exit 1; done

      # Nino's own suite still passes with the features in place - a feature
      # that breaks the kernel's tests is not compatible either
      - name: Run Nino's features contract test
        run: cd nino && php tests/features-smoke.php

      - name: Analyse the features with PHPStan
        run: cd nino && phpstan analyse --no-progress --memory-limit=1G

      - name: Analyse the panel scripts with ESLint
        # features/ may hold no script at all: no file to lint is no failure
        run: cd nino && npx --yes eslint@9.39.0 --no-error-on-unmatched-pattern features

      - name: Keep the catalogue as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalogue
          path: catalogue.json
